site_name: EuroCRM Wiki
site_description: European CRM solution wiki (business case, architecture, data model)
repo_url: https://github.com/newportg/POC-EuroCRM
docs_dir: POC-EuroCRM-Vault/wiki
site_dir: site

theme:
  name: material
  features:
    - navigation.instant
    - navigation.top
    - navigation.indexes
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Renders [[diagram.puml]] embeds to PNG (hooks run after plugins, so the
# rewrite happens once roamlinks has already resolved the relative path).
hooks:
  - hooks/render_diagrams.py

# Resolves Obsidian-style [[wikilinks]] used throughout the vault into real relative links.
plugins:
  - search
  - roamlinks

markdown_extensions:
  - meta
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight

# No manual "nav" — mkdocs auto-builds it from the wiki's directory/file
# structure so new notes show up without editing this file.
